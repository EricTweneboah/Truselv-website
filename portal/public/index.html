<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#14283b">
  <title>TruSelv secure portal</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/resources.css">
  <script src="/echarts.min.js"></script>
  <script src="/exceljs.min.js"></script>

  <script src="/resources.js" defer></script>

<body>
  <a class="skip" href="#main">Skip to content</a>
  <header><a class="brand" href="/"><img class="brand-logo" src="/logo-white.svg" width="140" height="49" alt="TruSelv"><span id="brand-subtitle">TESS Facility Portal</span></a><div class="account"><span id="identity" aria-live="polite">Loading secure workspace...</span><a class="signout" href="/api/auth/logout">Sign out</a></div></header>

    <main id="main"><p id="error" class="error" hidden></p><section id="app" aria-live="polite"><p>Loading…</p></section></main>
