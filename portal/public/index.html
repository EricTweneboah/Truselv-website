<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#14283b">
  <title>TruSelv secure portal</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/portal.css">
  <link rel="stylesheet" href="/resources.css">
  <script src="/echarts.min.js"></script>
  <script src="/exceljs.min.js"></script>
  <script src="/portal.js" defer></script>
  <script src="/resources.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Collapse navigation" aria-expanded="true">☰</button>
    <a class="brand" href="/"><img class="brand-logo" src="/logo-white.svg" width="140" height="49" alt="TruSelv"><span id="brand-subtitle">TESS Facility Portal</span></a>
    <button id="command-open" class="command-trigger" type="button"><span>Search or go to…</span><kbd>Ctrl K</kbd></button>
    <div class="account"><span id="identity" aria-live="polite">Loading secure workspace...</span><a class="signout" href="/api/auth/logout">Sign out</a></div>
  </header>
  <div class="layout">
    <nav id="sidebar" aria-label="Portal navigation">
      <p class="nav-label">Workspace</p>
      <button data-view="overview" data-icon="⌂" aria-current="page"><span>Overview</span></button>
      <div data-role="admin" class="nav-group"><p class="nav-label">Administration</p><button data-view="facilities" data-icon="◇"><span>Organisations</span></button><button data-view="licences" data-icon="▣"><span>All licences</span></button><button data-view="resources" data-icon="▤"><span>Website resources</span></button><button data-view="marketing" data-icon="✉"><span>Marketing updates</span></button></div>
      <button id="facility-context" data-icon="◎" hidden></button>
      <div class="nav-group" data-facility-view><p class="nav-label">Organisation</p><button data-view="analytics" data-icon="⌁"><span>Analytics &amp; CQC</span></button><button data-view="residents" data-icon="♙" data-role="facility-structure"><span>Residents</span></button><button data-view="wards" data-icon="▦" data-role="facility-structure"><span>Wards &amp; units</span></button><button data-view="devices" data-icon="▱" data-role="manage"><span>Devices</span></button><button data-view="configuration" data-icon="⚙" data-role="manage"><span>Organisation setup</span></button><button data-view="team" data-icon="♧" data-role="manage"><span>Team access</span></button></div>
      <div class="nav-bottom"><button data-view="support" data-icon="?"><span>Support</span></button></div>
    </nav>
    <main id="main">
      <div class="workspace-toolbar"><nav id="breadcrumbs" aria-label="Breadcrumb"><ol><li>Portal</li><li aria-current="page">Overview</li></ol></nav><button id="density-toggle" class="toolbar-button" type="button" aria-pressed="false">Compact tables</button></div>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="app" aria-live="polite" aria-busy="true"><div class="loading-state" aria-label="Loading"><span></span><span></span><span></span></div></section>
    </main>
  </div>
  <dialog id="command-dialog" class="command-dialog"><form method="dialog"><div class="command-head"><label for="command-search">Search pages</label><button value="cancel" aria-label="Close">×</button></div><input id="command-search" type="search" autocomplete="off" placeholder="Type a page name…"><div id="command-results" class="command-results"></div></form></dialog>
  <dialog id="record-dialog" class="record-dialog"><div class="drawer-head"><div><p class="eyebrow">Record details</p><h2 id="record-title">Details</h2></div><button id="record-close" type="button" aria-label="Close details">×</button></div><dl id="record-details"></dl></dialog>
</body>
</html>
